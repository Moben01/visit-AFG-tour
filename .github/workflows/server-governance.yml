name: Server governance baseline (static only)
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: server-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: application
      - name: Static source audit without production credentials
        run: |
          cat > "$RUNNER_TEMP/source_audit.py" <<'PY'
          """Static project baseline only: never imports app settings or touches a database."""
          import argparse
          import ast
          import json
          import os
          from pathlib import Path

          parser = argparse.ArgumentParser()
          parser.add_argument('--source', required=True)
          parser.add_argument('--project', required=True)
          args = parser.parse_args()
          root = Path(args.source).resolve()
          excluded = {'.git', '.venv', 'venv', 'node_modules', '__pycache__', 'static', 'staticfiles', 'media', 'uploads', '.next', 'dist', 'build'}
          checked = 0
          errors = []
          for directory, children, files in os.walk(root):
              children[:] = [name for name in children if name not in excluded and not Path(directory, name).is_symlink()]
              for name in files:
                  path = Path(directory, name)
                  if path.suffix != '.py' or path.is_symlink() or path.stat().st_size > 2 * 1024**2:
                      continue
                  checked += 1
                  try:
                      ast.parse(path.read_bytes(), filename=str(path.relative_to(root)))
                  except (SyntaxError, ValueError) as error:
                      errors.append({'file': str(path.relative_to(root)), 'line': getattr(error, 'lineno', None),
                                     'kind': type(error).__name__})
          report = {'project': args.project, 'python_files_checked': checked, 'syntax_errors': errors,
                    'application_imported': False, 'database_accessed': False,
                    'deployment_authorized': False, 'application_test_profile_required': True}
          Path('source-audit.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          if errors:
              raise SystemExit(1)
          PY
          python3 "$RUNNER_TEMP/source_audit.py" --source application --project visit-afg-tour
      - name: Record deployment boundary
        if: always()
        run: |
          {
            echo '### Static baseline only'
            echo 'No server access, production secrets or customer database is used.'
            echo 'This check does not satisfy application, PostgreSQL, migration, restore or release-approval gates.'
            echo 'Staging and production adoption remain disabled in the project profile.'
          } >> "$GITHUB_STEP_SUMMARY"
